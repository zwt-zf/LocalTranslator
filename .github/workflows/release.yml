name: Release

on:
  push:
    tags:
      - "v*.*.*"
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "9.0.x"
      - name: Build development dictionary
        shell: pwsh
        run: .\scripts\build-dictionary.ps1
      - name: Test
        shell: pwsh
        run: dotnet test .\LocalTranslator.slnx -c Release -p:Platform=x64
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Build release assets
        shell: pwsh
        run: |
          .\scripts\pack.ps1 -Platform x64 -FullDictionary
          .\scripts\build-installer.ps1
      - name: Validate version and create checksums
        shell: pwsh
        run: |
          $manifest = Get-Content `
            .\Community.PowerToys.Run.Plugin.LocalTranslator\plugin.json |
            ConvertFrom-Json
          $version = $manifest.Version
          if ($env:GITHUB_REF_NAME -ne "v$version") {
              throw "Tag $env:GITHUB_REF_NAME does not match plugin version $version"
          }
          "VERSION=$version" >> $env:GITHUB_ENV
          $files = Get-Item `
            ".\artifacts\LocalTranslator-Setup-$version-x64.exe", `
            ".\artifacts\LocalTranslator-$version-x64.zip"
          $files | ForEach-Object {
              $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $($_.Name)"
          } | Set-Content .\artifacts\SHA256SUMS.txt -Encoding ascii
      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" `
            ".\artifacts\LocalTranslator-Setup-$env:VERSION-x64.exe" `
            ".\artifacts\LocalTranslator-$env:VERSION-x64.zip" `
            ".\artifacts\SHA256SUMS.txt" `
            --verify-tag `
            --generate-notes `
            --title "LocalTranslator $env:GITHUB_REF_NAME" `
            --latest
